# Copy this file into tfc-hmi (centroid-is/CentroidX) as
# .github/workflows/dispatch.yml.
#
# tfc-hmi is private; its builds, tests and releases run in the public
# repository centroid-is/tfc-hmi-workflows. This is the one workflow that has
# to stay in tfc-hmi: it tells the other repository that something happened.
# It runs on a self-hosted runner (runs-on: self-hosted), so it costs no
# private-repo Actions minutes. The runner needs git, gh and bash (Git for
# Windows is enough on a Windows box), nothing else.
#
# Needs one secret in tfc-hmi, WORKFLOWS_DISPATCH_TOKEN: a token with
# Contents and Pull requests read/write on centroid-is/tfc-hmi-workflows.
# The GH_PAT already used over there will do if it has them.
#
# What goes where:
#   push to main        -> repository_dispatch "push-main" -> Tests, Main Prerelease
#   push of a version   -> repository_dispatch "tag"       -> Tag Release
#     tag (not main-latest, not station-v*)
#   pull request        -> a mirror pull request over there: branch
#     opened, pushed to,    tfc-hmi/pr-N carrying tfc-hmi-source.json, which
#     reopened, closed      names the commit to test. Every push here
#                           force-pushes that branch, so Tests runs there as an
#                           ordinary pull request with its checks on it; the
#                           verdict comes back here as the commit status
#                           "tfc-hmi-workflows / tests". Closing here closes
#                           the mirror and deletes its branch.
#
# tfc-hmi-workflows is PUBLIC and tfc-hmi is not. The mirror therefore carries
# the pull request's number and commit and nothing else: it is titled "pr-N",
# has no description, and neither the source file nor the commit message names
# the title or the branch. Do not add either back for convenience; a feature
# name on a public pull request is a leak.

name: Dispatch to tfc-hmi-workflows

on:
  push:
    branches: [main]
    tags:
      - '*'
      - '!main-latest'
      - '!station-v*'
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

env:
  WORKFLOWS_REPO: centroid-is/tfc-hmi-workflows

jobs:
  dispatch:
    if: github.event_name == 'push'
    runs-on: self-hosted
    steps:
      - name: Send the push as a repository_dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.WORKFLOWS_DISPATCH_TOKEN }}
        run: |
          case "$GITHUB_REF" in
            refs/heads/main)
              gh api "repos/$WORKFLOWS_REPO/dispatches" -f event_type=push-main \
                -f "client_payload[repository]=$GITHUB_REPOSITORY" -f "client_payload[sha]=$GITHUB_SHA"
              ;;
            refs/tags/*)
              gh api "repos/$WORKFLOWS_REPO/dispatches" -f event_type=tag \
                -f "client_payload[repository]=$GITHUB_REPOSITORY" -f "client_payload[sha]=$GITHUB_SHA" \
                -f "client_payload[tag]=${GITHUB_REF#refs/tags/}"
              ;;
            *)
              echo "nothing to dispatch for $GITHUB_REF"
              ;;
          esac

  mirror-pr:
    if: github.event_name == 'pull_request'
    runs-on: self-hosted
    env:
      GH_TOKEN: ${{ secrets.WORKFLOWS_DISPATCH_TOKEN }}
      ACTION: ${{ github.event.action }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out tfc-hmi-workflows
        uses: actions/checkout@v4
        with:
          repository: centroid-is/tfc-hmi-workflows
          token: ${{ secrets.WORKFLOWS_DISPATCH_TOKEN }}
          fetch-depth: 0

      - name: Close the mirror
        if: env.ACTION == 'closed'
        shell: bash
        run: |
          branch="tfc-hmi/pr-$PR_NUMBER"
          for n in $(gh pr list --repo "$WORKFLOWS_REPO" --head "$branch" --state open --json number -q '.[].number'); do
            gh pr close "$n" --repo "$WORKFLOWS_REPO" --comment "tfc-hmi#$PR_NUMBER was closed." --delete-branch
          done
          git push origin --delete "$branch" 2>/dev/null || true

      - name: Push the source commit to the mirror branch
        if: env.ACTION != 'closed'
        shell: bash
        run: |
          branch="tfc-hmi/pr-$PR_NUMBER"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch" origin/main
          # Number and commit only: this file is public. gh's built-in jq
          # writes it, so the runner needs no jq.
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            --jq '{repository: $ENV.GITHUB_REPOSITORY, sha: $ENV.PR_SHA, pr: $ENV.PR_NUMBER}' \
            > tfc-hmi-source.json
          cat tfc-hmi-source.json
          git add tfc-hmi-source.json
          git commit -m "pr-$PR_NUMBER at ${PR_SHA:0:7}"
          git push --force origin "$branch"

      - name: Open the mirror pull request if there is none
        if: env.ACTION != 'closed'
        shell: bash
        run: |
          branch="tfc-hmi/pr-$PR_NUMBER"
          existing=$(gh pr list --repo "$WORKFLOWS_REPO" --head "$branch" --state open --json number -q '.[0].number')
          if [ -n "$existing" ]; then
            echo "mirror is $WORKFLOWS_REPO#$existing"
            # A mirror opened before titles were withheld still carries one.
            gh api -X PATCH "repos/$WORKFLOWS_REPO/pulls/$existing" -f title="pr-$PR_NUMBER" -f body="" --silent
            exit 0
          fi
          gh pr create --repo "$WORKFLOWS_REPO" --head "$branch" --base main \
            --title "pr-$PR_NUMBER" --body ""
