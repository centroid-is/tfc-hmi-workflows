name: Windows MSIX Build

# The Windows build three ways: the sideload MSIX (signed with the Centroid
# certificate), the portable Release folder, and the public certificate
# stations put in TrustedPeople. The centroidx-manager executable is built and
# signed first and bundled into the app's assets, so the copy a station
# extracts is signed. Called by test.yml (every PR), main-prerelease.yml and
# tag-release.yml.

on:
  workflow_call:
    inputs:
      ref:
        description: tfc-hmi commit, branch or tag to build
        type: string
        required: true
      stamp_unstable_version:
        description: >
          Stamp an msix_version that sorts below every stable release
          (0.YYYY.M.run). main-prerelease passes true; tag-release passes
          false because the version is already committed in pubspec.yaml.
        type: boolean
        default: false
      group:
        description: Concurrency key; runs sharing it supersede each other (PRs). Empty = never cancelled.
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      ref:
        description: tfc-hmi commit, branch or tag to build
        type: string
        default: main
      stamp_unstable_version:
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: windows-${{ inputs.group || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows MSIX Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out tfc-hmi
        id: src
        uses: ./.github/actions/checkout-source
        with:
          ref: ${{ inputs.ref }}
          token: ${{ secrets.GH_PAT }}

      # go.sum is not at the repository root, so the module cache has to be
      # told where it is or it never restores.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: src/tools/centroidx-manager/go.sum

      - name: Embed the manager's icon and manifest
        shell: bash
        working-directory: src/tools/centroidx-manager
        run: windres --use-temp-file -o centroidx.syso centroidx.rc

      - name: Build centroidx-manager
        shell: bash
        working-directory: src/tools/centroidx-manager
        run: go build -o centroidx-manager_windows_amd64.exe .

      - name: Sign centroidx-manager with the sideload certificate
        shell: powershell
        working-directory: src/tools/centroidx-manager
        env:
          MSIX_CERT_PFX_BASE64: ${{ secrets.MSIX_CERT_PFX_BASE64 }}
          MSIX_CERT_PASSWORD: ${{ secrets.MSIX_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:MSIX_CERT_PFX_BASE64)) { throw "MSIX_CERT_PFX_BASE64 is not set; the manager and the MSIX must be signed." }
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:MSIX_CERT_PFX_BASE64))
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found in the Windows Kits" }
          & $signtool.FullName sign /f $pfx /p $env:MSIX_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 centroidx-manager_windows_amd64.exe
          if ($LASTEXITCODE -ne 0) { throw "signtool failed with $LASTEXITCODE" }
          Remove-Item $pfx -Force
          $sig = Get-AuthenticodeSignature centroidx-manager_windows_amd64.exe
          # The certificate is self-signed, so Status is UnknownError on a runner
          # that does not trust it; the chain says nothing. Assert the evidence
          # that matters: signed, by our subject, and timestamped so the
          # signature outlives the certificate.
          if ($sig.Status -eq 'NotSigned' -or -not $sig.SignerCertificate) { throw "not signed" }
          if ($sig.SignerCertificate.Subject -ne 'CN=Centroid, O=Centroid ehf., C=IS') { throw "unexpected signer $($sig.SignerCertificate.Subject)" }
          if (-not $sig.TimeStamperCertificate) { throw "signature carries no timestamp" }
          Write-Host "signed by $($sig.SignerCertificate.Subject), timestamped, status $($sig.Status)"

      - name: Bundle the manager into the app assets
        shell: bash
        run: |
          mkdir -p src/centroid-hmi/assets/manager
          cp src/tools/centroidx-manager/centroidx-manager_windows_amd64.exe src/centroid-hmi/assets/manager/

      - uses: ./.github/actions/setup-flutter

      - uses: ./.github/actions/pub-get
        with:
          working-directory: src/centroid-hmi

      - name: Build
        shell: bash
        working-directory: src/centroid-hmi
        run: |
          flutter build windows --release \
            --dart-define=GIT_SHA=${{ steps.src.outputs.sha }} \
            --dart-define=CENTROIDX_CHAT=false \
            --dart-define=CENTROIDX_KNOWLEDGE=false

      - name: Write the certificate PFX from the secret
        shell: bash
        working-directory: src/centroid-hmi
        env:
          MSIX_CERT_PFX_BASE64: ${{ secrets.MSIX_CERT_PFX_BASE64 }}
        run: echo "$MSIX_CERT_PFX_BASE64" | base64 --decode > centroidx-sideload.pfx

      # The manager looks for a .cer release asset to put in TrustedPeople;
      # without it a sideload install fails with 0x800B0109. Exported from the
      # PFX rather than minted fresh, so it is the certificate the package was
      # signed with. ASCII only in this script: PowerShell 5.1 reads it as ANSI.
      - name: Export the public sideload certificate
        shell: powershell
        working-directory: src/centroid-hmi
        env:
          MSIX_CERT_PASSWORD: ${{ secrets.MSIX_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pw = ConvertTo-SecureString $env:MSIX_CERT_PASSWORD -AsPlainText -Force
          $cert = (Get-PfxData -FilePath centroidx-sideload.pfx -Password $pw).EndEntityCertificates[0]
          Export-Certificate -Cert $cert -FilePath centroidx-sideload.cer -Type CERT | Out-Null
          $check = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2((Resolve-Path centroidx-sideload.cer).Path)
          if ($check.HasPrivateKey) { throw "the exported certificate carries a private key" }
          if ($check.Subject -ne 'CN=Centroid, O=Centroid ehf., C=IS') { throw "unexpected subject $($check.Subject)" }
          Write-Host "thumbprint $($check.Thumbprint), valid until $($check.NotAfter)"

      - uses: actions/upload-artifact@v4
        with:
          name: centroidx-sideload.cer
          path: src/centroid-hmi/centroidx-sideload.cer

      # A main build must always be an older version than any stable release,
      # so a station on stable never sees it as an upgrade. 0.YYYY.M.run sorts
      # below every 2026.x. Per build only, never committed.
      - name: Stamp an unstable package version
        if: inputs.stamp_unstable_version
        shell: bash
        working-directory: src/centroid-hmi
        run: |
          MSIX_VERSION="0.$(date -u +%Y).$(date -u +%-m).${{ github.run_number }}"
          sed -i "s/^  msix_version: .*/  msix_version: $MSIX_VERSION/" pubspec.yaml
          grep -n 'msix_version' pubspec.yaml

      # msix:create reruns `flutter build windows`, so the defines ride along.
      - name: Build MSIX (sideload, signed)
        shell: powershell
        working-directory: src/centroid-hmi
        run: |
          echo "n" | dart run msix:create --certificate-password "${{ secrets.MSIX_CERT_PASSWORD }}" --windows-build-args "--dart-define=GIT_SHA=${{ steps.src.outputs.sha }} --dart-define=CENTROIDX_CHAT=false --dart-define=CENTROIDX_KNOWLEDGE=false"
          if ($LASTEXITCODE -ne 0) { throw "msix:create failed with $LASTEXITCODE" }

      - name: Locate and verify the MSIX
        id: locate
        shell: powershell
        working-directory: src/centroid-hmi
        run: |
          $ErrorActionPreference = 'Stop'
          $msix = Get-ChildItem -Recurse -Filter *.msix | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $msix) { throw "No .msix found" }
          $sig = Get-AuthenticodeSignature $msix.FullName
          # Self-signed sideload certificate: the runner reports UnknownError for
          # the chain, so assert the signer instead of the status.
          if ($sig.Status -eq 'NotSigned' -or -not $sig.SignerCertificate) { throw "the MSIX is not signed" }
          if ($sig.SignerCertificate.Subject -ne 'CN=Centroid, O=Centroid ehf., C=IS') { throw "MSIX signed by '$($sig.SignerCertificate.Subject)', expected our subject" }
          Write-Host "$($msix.FullName) $([math]::Round($msix.Length / 1MB)) MB, signed by $($sig.SignerCertificate.Subject), status $($sig.Status)"
          "msix=$($msix.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - uses: actions/upload-artifact@v4
        with:
          name: centroid-hmi.msix
          path: ${{ steps.locate.outputs.msix }}

      # The portable folder needs the VC++ runtime beside the exe, and must
      # not carry the 26 MB package msix:create drops into it.
      - name: Make the Release folder portable
        shell: powershell
        working-directory: src/centroid-hmi
        run: |
          $release = 'build\windows\x64\runner\Release'
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "C:\Windows\System32\$dll" $release
          }
          Remove-Item "$release\*.msix" -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: centroid-hmi-windows-portable
          path: src/centroid-hmi/build/windows/x64/runner/Release/
