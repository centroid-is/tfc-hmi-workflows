name: Embedded Linux images

# The station images on ghcr.io: centroid-hmi (the flutter-elinux bundle in
# docker/frontend), centroid-backend (docker/backend) and hmi-profiler
# (docker/profiler). Which tags are pushed depends on `publish`:
#
#   pr    centroid-hmi:pr-N, centroid-backend:pr-N, hmi-profiler:pr-N
#   main  :<sha> and :latest (a DEBUG Flutter build), plus :<sha>-release /
#         :latest-release (production mode) and :<sha>-profile /
#         :latest-profile (Dart VM service kept, for docker/profiler)
#   tag   :<sha> and :stable, built in release mode
#
# A release or profile build also leaves the symbols of its Dart AOT library
# (lib/libapp.so) in the private package centroid-hmi-symbols, tagged with the
# library's build-id and with <sha>-<mode>; see "Keep the AOT symbols".
#
# Called by test.yml (pr), main-prerelease.yml (main) and tag-release.yml (tag).

on:
  workflow_call:
    inputs:
      ref:
        description: tfc-hmi commit, branch or tag to build
        type: string
        required: true
      publish:
        description: pr | main | tag (see above)
        type: string
        required: true
      pr_number:
        description: Pull request number, for the pr-N tags
        type: string
        default: ''
      group:
        description: Concurrency key; runs sharing it supersede each other (PRs). Empty = never cancelled.
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      ref:
        description: tfc-hmi commit, branch or tag to build
        type: string
        default: main
      publish:
        description: pr | main | tag. "pr" with no number builds and pushes nothing.
        type: choice
        options: [pr, main, tag]
        default: pr

permissions:
  contents: read

concurrency:
  group: elinux-${{ inputs.group || github.run_id }}
  cancel-in-progress: true

env:
  TOOLCHAIN: ghcr.io/centroid-is/tfc-toolchain:latest

jobs:
  # Three bundle flavours; a tag build needs only the release one.
  elinux-build:
    name: flutter-elinux (${{ matrix.mode }})
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/centroid-is/tfc-toolchain:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GH_PAT }}
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ inputs.publish == 'tag' && fromJSON('["release"]') || (inputs.publish == 'main' && fromJSON('["debug","release","profile"]') || fromJSON('["debug","release","profile"]')) }}
    outputs:
      sha: ${{ steps.src.outputs.short_sha }}
    steps:
      - run: git config --system --add safe.directory '*'
      - uses: actions/checkout@v4
      - name: Check out tfc-hmi
        id: src
        uses: ./.github/actions/checkout-source
        with:
          ref: ${{ inputs.ref }}
          token: ${{ secrets.GH_PAT }}

      # Upstream flutter-elinux at 3.47.0 carries its own native-asset hook
      # support, shadowing the toolchain image's baked copy. If this stays
      # green the pin moves into tfc-toolchain and this step goes away.
      - name: Use upstream flutter-elinux 3.47.0
        run: |
          git clone https://github.com/flutter-elinux/flutter-elinux.git /opt/flutter-elinux-347
          git -C /opt/flutter-elinux-347 checkout 4d63880dfaba6e30530b88f2344e0a7b870228b2
          echo "/opt/flutter-elinux-347/bin" >> "$GITHUB_PATH"

      - name: Create the elinux platform folder
        working-directory: src/centroid-hmi
        run: flutter-elinux create --platforms=elinux .

      # libcef.so needs ALSA and NSS/NSPR at link time; libasound2t64 is the
      # name after trixie's t64 transition.
      - name: Install CEF link dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libnss3 libnspr4 libasound2t64

      - uses: ./.github/actions/pub-get
        with:
          command: flutter-elinux pub get
          working-directory: src/centroid-hmi

      # The defines stay on the command line: tfc-hmi's
      # test/tools/shipped_feature_flags_test.dart reads this file and checks
      # every build line for them.
      #
      # --save-debugging-info has the Dart compiler write the symbols of
      # lib/libapp.so (function names and source lines) to a file outside the
      # bundle. The library itself comes out byte for byte as it does without
      # the option, so nothing that ships changes. It is deliberately not
      # --split-debug-info: that writes the same kind of file, but also makes
      # every stack trace the app prints a list of addresses instead of
      # function names. A debug build has no AOT library and ignores the
      # option.
      - name: Build (${{ matrix.mode }})
        working-directory: src/centroid-hmi
        run: |
          mkdir -p "$RUNNER_TEMP/aot-symbols"
          flutter-elinux build elinux --${{ matrix.mode }} --dart-define=CENTROIDX_CHAT=false --dart-define=CENTROIDX_KNOWLEDGE=false --extra-gen-snapshot-options=--save-debugging-info="$RUNNER_TEMP/aot-symbols/app.linux-x64.symbols"

      - name: Collect the bundle
        working-directory: src/centroid-hmi
        run: |
          mkdir -p assets
          mv build/elinux/x64/${{ matrix.mode }}/bundle/* assets/

      # The VM Service RPC table string is present in a profile engine and
      # absent in a release one.
      - name: Verify the engine really is a profile build
        if: matrix.mode == 'profile'
        working-directory: src/centroid-hmi
        run: |
          if ! grep -a -q getCpuSamples assets/lib/libflutter_engine.so; then
            echo "::error::libflutter_engine.so carries no VM service; this is not a profile engine"
            exit 1
          fi

      # The symbols go to ghcr.io as a one-file image in a package of their
      # own, which is private. Not an artifact: any signed-in GitHub user can
      # download this repository's artifacts, and the bundle below is all they
      # are meant to get.
      #
      # The image is tagged with the build-id of the libapp.so it belongs to,
      # which is what a core file or a debugger names, and with <sha>-<mode>,
      # which moves when the same commit is built again. Symbols whose
      # build-id is not the library's would be worse than none, so a mismatch
      # fails the job.
      #
      # This job runs in the toolchain container, which has no Docker; crane
      # pushes an image without one.
      - name: Keep the AOT symbols
        if: matrix.mode != 'debug'
        shell: bash
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          IMG: ghcr.io/centroid-is/centroid-hmi-symbols
          SHA: ${{ steps.src.outputs.sha }}
          TAG: selftest-${{ matrix.mode }}
          MODE: ${{ matrix.mode }}
          CRANE_VERSION: v0.22.1
          CRANE_SHA256: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0
        run: |
          set -euo pipefail
          symbols="$RUNNER_TEMP/aot-symbols/app.linux-x64.symbols"
          build_id_of() { readelf -n "$1" | sed -n 's/^ *Build ID: *//p' | head -n 1; }
          build_id="$(build_id_of src/centroid-hmi/assets/lib/libapp.so)"
          symbols_id="$(build_id_of "$symbols")"
          if [ -z "$build_id" ] || [ "$build_id" != "$symbols_id" ]; then
            echo "::error::libapp.so has build-id '$build_id' and the symbols file has '$symbols_id'; they must come from the same compile"
            exit 1
          fi

          url="https://github.com/google/go-containerregistry/releases/download/$CRANE_VERSION/go-containerregistry_Linux_x86_64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/crane.tar.gz" "$url"
          echo "$CRANE_SHA256  $RUNNER_TEMP/crane.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/crane.tar.gz" -C "$RUNNER_TEMP" crane
          crane="$RUNNER_TEMP/crane"
          printf '%s' "$GH_PAT" | "$crane" auth login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

          tar -C "$RUNNER_TEMP/aot-symbols" -cf "$RUNNER_TEMP/aot-symbols.tar" app.linux-x64.symbols
          labels=(
            -l "org.opencontainers.image.source=https://github.com/centroid-is/CentroidX"
            -l "org.opencontainers.image.revision=$SHA"
            -l "is.centroid.aot.build-id=$build_id"
            -l "is.centroid.aot.mode=$MODE"
          )
          push() {
            "$crane" append --oci-empty-base -f "$RUNNER_TEMP/aot-symbols.tar" -t "$IMG:$build_id" &&
            "$crane" mutate "$IMG:$build_id" -t "$IMG:$build_id" --set-platform linux/amd64 "${labels[@]}" &&
            "$crane" tag "$IMG:$build_id" "$TAG"
          }
          # ghcr.io drops a push now and then; see docker-build-push.
          if ! push; then
            echo "::warning::pushing the symbols failed on the first attempt; retrying once."
            sleep 20
            push
          fi
          "$crane" auth logout ghcr.io
          echo "kept the symbols of libapp.so $build_id ($(stat -c %s "$symbols") bytes) as $IMG:$build_id and $IMG:$TAG"

      - uses: actions/upload-artifact@v4
        with:
          name: centroid-hmi-bundle-${{ matrix.mode }}
          path: src/centroid-hmi/assets/

  frontend-image:
    name: centroid-hmi image (${{ matrix.mode }})
    needs: elinux-build
    if: inputs.publish != 'pr' || inputs.pr_number != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ inputs.publish == 'tag' && fromJSON('["release"]') || (inputs.publish == 'main' && fromJSON('["debug","release","profile"]') || fromJSON('["debug"]')) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-source
        with:
          ref: ${{ inputs.ref }}
          token: ${{ secrets.GH_PAT }}
      - uses: actions/download-artifact@v4
        with:
          name: centroid-hmi-bundle-${{ matrix.mode }}
          path: src/docker/frontend/bundle
      - uses: ./.github/actions/ghcr-login
        with:
          token: ${{ secrets.GH_PAT }}
      - name: Choose the tags
        id: tags
        env:
          SHA: ${{ needs.elinux-build.outputs.sha }}
          IMG: ghcr.io/centroid-is/centroid-hmi
        run: |
          case "${{ inputs.publish }}-${{ matrix.mode }}" in
            pr-debug)      tags="$IMG:pr-${{ inputs.pr_number }}" ;;
            main-debug)    tags="$IMG:$SHA"$'\n'"$IMG:latest" ;;
            main-release)  tags="$IMG:$SHA-release"$'\n'"$IMG:latest-release" ;;
            main-profile)  tags="$IMG:$SHA-profile"$'\n'"$IMG:latest-profile" ;;
            tag-release)   tags="$IMG:$SHA"$'\n'"$IMG:stable" ;;
            *) echo "::error::no tags for ${{ inputs.publish }}/${{ matrix.mode }}"; exit 1 ;;
          esac
          { echo 'tags<<EOF'; echo "$tags"; echo 'EOF'; } >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/docker-build-push
        with:
          context: src/docker/frontend
          build-args: |
            APP_BIN=centroidx
            APP_BUNDLE=bundle
          tags: ${{ steps.tags.outputs.tags }}

  # The backend's -profile variant is a named stage of the same Dockerfile;
  # built in the same job so it reuses the open62541 layers instead of
  # rebuilding them on a second runner.
  backend-image:
    name: centroid-backend image
    if: inputs.publish != 'pr' || inputs.pr_number != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: src
        uses: ./.github/actions/checkout-source
        with:
          ref: ${{ inputs.ref }}
          token: ${{ secrets.GH_PAT }}
      - uses: ./.github/actions/ghcr-login
        with:
          token: ${{ secrets.GH_PAT }}
      - name: Choose the tags
        id: tags
        env:
          SHA: ${{ steps.src.outputs.short_sha }}
          IMG: ghcr.io/centroid-is/centroid-backend
        run: |
          case "${{ inputs.publish }}" in
            pr)   tags="$IMG:pr-${{ inputs.pr_number }}" ;;
            main) tags="$IMG:$SHA"$'\n'"$IMG:latest" ;;
            tag)  tags="$IMG:$SHA"$'\n'"$IMG:stable" ;;
          esac
          { echo 'tags<<EOF'; echo "$tags"; echo 'EOF'; } >> "$GITHUB_OUTPUT"
          { echo 'profile<<EOF'; echo "$IMG:$SHA-profile"; echo "$IMG:latest-profile"; echo 'EOF'; } >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/docker-build-push
        with:
          context: src
          file: src/docker/backend/Dockerfile
          tags: ${{ steps.tags.outputs.tags }}
      - if: inputs.publish == 'main'
        uses: ./.github/actions/docker-build-push
        with:
          context: src
          file: src/docker/backend/Dockerfile
          target: profile
          tags: ${{ steps.tags.outputs.profile }}

  # python:alpine plus a stdlib script; built on every PR so docker/profiler
  # does not rot.
  profiler-image:
    name: hmi-profiler image
    if: inputs.publish != 'pr' || inputs.pr_number != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: src
        uses: ./.github/actions/checkout-source
        with:
          ref: ${{ inputs.ref }}
          token: ${{ secrets.GH_PAT }}
      - uses: ./.github/actions/ghcr-login
        with:
          token: ${{ secrets.GH_PAT }}
      - name: Choose the tags
        id: tags
        env:
          SHA: ${{ steps.src.outputs.short_sha }}
          IMG: ghcr.io/centroid-is/hmi-profiler
        run: |
          case "${{ inputs.publish }}" in
            pr)   tags="$IMG:pr-${{ inputs.pr_number }}" ;;
            main) tags="$IMG:$SHA"$'\n'"$IMG:latest" ;;
            tag)  tags="$IMG:$SHA"$'\n'"$IMG:stable" ;;
          esac
          { echo 'tags<<EOF'; echo "$tags"; echo 'EOF'; } >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/docker-build-push
        with:
          context: src
          file: src/docker/profiler/Dockerfile
          tags: ${{ steps.tags.outputs.tags }}
