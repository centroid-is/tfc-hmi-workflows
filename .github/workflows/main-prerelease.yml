name: Main Prerelease

# The rolling prerelease: every push to tfc-hmi main (relayed by the bridge
# workflow as repository_dispatch "push-main") rebuilds everything and
# republishes the `main-latest` release of THIS repository, which is what the
# app's `latest` update channel and the manager follow.
#
# The tag is `main-latest`, not `main`: a tag named like a branch makes
# `git <cmd> main` ambiguous, and tag-release.yml would treat it as a version.

on:
  repository_dispatch:
    types: [push-main]
  workflow_dispatch:
    inputs:
      ref:
        description: tfc-hmi commit or branch to publish as main-latest
        type: string
        default: main

permissions:
  contents: write

concurrency:
  group: main-prerelease
  cancel-in-progress: true

jobs:
  context:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.ctx.outputs.ref }}
    steps:
      # Resolved to the full sha: a hand run passes a branch name, and the
      # release notes name the exact commit for the app's updater (below).
      - id: ctx
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REF: ${{ github.event.client_payload.sha || inputs.ref }}
        run: |
          set -euo pipefail
          ref=$(gh api "repos/centroid-is/CentroidX/commits/$REF" --jq .sha)
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "publishing tfc-hmi $ref as main-latest"

  windows-build:
    needs: context
    uses: ./.github/workflows/windows.yml
    secrets: inherit
    with:
      ref: ${{ needs.context.outputs.ref }}
      stamp_unstable_version: true
  macos-build:
    needs: context
    uses: ./.github/workflows/macos.yml
    secrets: inherit
    with:
      ref: ${{ needs.context.outputs.ref }}
  linux-build:
    needs: context
    uses: ./.github/workflows/linux.yml
    secrets: inherit
    with:
      ref: ${{ needs.context.outputs.ref }}
  # The integration tests download from the release this run is about to
  # replace; gating on them deadlocked releases once.
  manager-build:
    needs: context
    uses: ./.github/workflows/manager.yml
    secrets: inherit
    with:
      ref: ${{ needs.context.outputs.ref }}
      run_integration_tests: false
  elinux-images:
    needs: context
    uses: ./.github/workflows/elinux.yml
    secrets: inherit
    with:
      ref: ${{ needs.context.outputs.ref }}
      publish: main
  # Attached to main-latest by publish-station once both it and the apps'
  # publish are done; it gates nothing.
  station-image:
    needs: context
    uses: ./.github/workflows/station-image.yml
    secrets: inherit
    with:
      ref: ${{ needs.context.outputs.ref }}
      channel: prerelease
      preload: true

  # The apps alone. The station image takes ~25 min longer than the slowest
  # app and is ~3 GB to move, so waiting for it held every platform back by
  # that much; publish-station attaches it afterwards.
  #
  # Still a delete and re-create, not uploads into a standing release: the
  # app's updater and the manager both read a release's published_at as
  # "a new build exists", and only a re-create moves it, once per commit.
  publish:
    needs: [context, windows-build, macos-build, linux-build, manager-build]
    if: >-
      !cancelled() &&
      needs.windows-build.result == 'success' &&
      needs.macos-build.result == 'success' &&
      needs.linux-build.result == 'success' &&
      needs.manager-build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: centroid-hmi-windows-portable
          path: centroidx-windows-x64/
      - uses: actions/download-artifact@v4
        with:
          name: centroid-hmi.msix
          path: msix/
      - uses: actions/download-artifact@v4
        with:
          name: centroidx-sideload.cer
          path: release/
      - uses: actions/download-artifact@v4
        with:
          name: centroidx_darwin_arm64.dmg
          path: release/
      - uses: actions/download-artifact@v4
        with:
          name: centroidx_linux_x64.tar.gz
          path: release/
      - uses: actions/download-artifact@v4
        with:
          pattern: centroidx-manager_*
          path: manager/
          merge-multiple: true

      - name: Assemble the release assets
        run: |
          set -euo pipefail
          zip -qr release/centroidx_windows_x64.zip centroidx-windows-x64
          # The canonical name the manager looks for; msix:create emits centroidx.msix.
          mv msix/*.msix release/centroidx_windows_amd64.msix
          mv manager/centroidx-manager_* release/
          cd release
          # Named, never globbed, so a missing asset fails here.
          sums=( centroidx_windows_x64.zip centroidx_windows_amd64.msix centroidx-sideload.cer centroidx_darwin_arm64.dmg centroidx_linux_x64.tar.gz centroidx-manager_windows_amd64.exe centroidx-manager_darwin_arm64.dmg centroidx-manager_linux_amd64 )
          sha256sum "${sums[@]}" > SHA256SUMS.txt
          ls -la

      # Created empty first so README links resolve seconds after the delete,
      # then assets uploaded smallest first with --clobber (an upload can fail
      # after the asset was saved, which makes the retry a 422 duplicate).
      #
      # GH_PAT, not github.token: on 2026-10-14 the token deleted the release
      # and was then refused the re-create (HTTP 403 "Resource not accessible
      # by integration", the tag at a commit that changes a workflow file),
      # which left no main-latest at all. The PAT carries the workflow scope.
      - name: Republish main-latest
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          SRC_SHA: ${{ needs.context.outputs.ref }}
        run: |
          set -uo pipefail
          cd release
          # The marker is how the app's latest channel knows which tfc-hmi
          # commit this is: the release's own target is a commit of THIS
          # repository and never matches the app's GIT_SHA. Hidden when the
          # notes render.
          notes="Automatically built from the tip of tfc-hmi \`main\` (${SRC_SHA:0:7}). Not a stable release.
          <!-- tfc-hmi-sha: ${SRC_SHA} -->

          | Platform | Asset | |
          |---|---|---|
          | macOS (Apple silicon) | \`centroidx_darwin_arm64.dmg\` | |
          | Windows portable | \`centroidx_windows_x64.zip\` | |
          | Windows sideload | \`centroidx_windows_amd64.msix\` + \`centroidx-sideload.cer\` | |
          | Linux | \`centroidx_linux_x64.tar.gz\` | |
          | Station USB installer | \`usb-installer.img.gz.part*\` + \`usb-installer.img.bmap\` | attached about 25 minutes after the rest; join with \`cat usb-installer.img.gz.part* > usb-installer.img.gz\`, checksums in \`SHA256SUMS-station.txt\` |

          centroidx-manager for Windows, macOS and Linux is attached as well. Checksums in \`SHA256SUMS.txt\`."

          upload() {
            local f=$1 attempt
            for attempt in 1 2 3; do
              if gh release upload main-latest --repo "$GITHUB_REPOSITORY" --clobber "$f"; then return 0; fi
              echo "::warning::upload of $f failed (attempt $attempt)"; sleep $((attempt * 30))
            done
            return 1
          }

          gh release delete main-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          # The release is gone from here on, so the create is retried rather
          # than left to fail once.
          created=
          for attempt in 1 2 3; do
            if gh release create main-latest --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
                --title "Latest main build" --notes "$notes"; then created=1; break; fi
            echo "::warning::creating main-latest failed (attempt $attempt)"; sleep $((attempt * 20))
          done
          if [ -z "$created" ]; then
            echo "::error::main-latest was deleted and could not be re-created: there is no main-latest now"
            exit 1
          fi

          failed=()
          while read -r f; do upload "$f" || failed+=("$f"); done < <(ls -rS -- *)
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::failed to upload: ${failed[*]}"
            exit 1
          fi

  # The stick, onto the release publish just made. Needs publish so its
  # delete cannot take the stick with it, and fails alone: a missing stick
  # leaves the apps' release as it is.
  publish-station:
    needs: [context, publish, station-image]
    if: >-
      !cancelled() &&
      needs.publish.result == 'success' &&
      needs.station-image.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: station-usb-installer
          path: release/
      - name: Attach the station installer
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -uo pipefail
          cd release
          for f in usb-installer.img.gz usb-installer.img.bmap; do
            if [ ! -f "$f" ]; then
              found=$(find . -name "$f" | head -1 || true)
              if [ -n "$found" ]; then echo "::warning::$f was nested at $found"; mv "$found" "$f"; fi
            fi
          done
          if [ ! -f usb-installer.img.gz ] || [ ! -f usb-installer.img.bmap ]; then
            echo "::error::the station-usb-installer artifact lacks the image or its bmap"; exit 1
          fi
          # GitHub refuses assets of 2 GiB and more. 800 MB parts: 1.7 GB
          # parts died with "HTTP 500: Error saving asset".
          if [ "$(stat -c %s usb-installer.img.gz)" -ge 2147483648 ]; then
            split -b 800000000 -d -a 2 usb-installer.img.gz usb-installer.img.gz.part && rm -f usb-installer.img.gz
          fi
          sha256sum usb-installer.img.gz* usb-installer.img.bmap > SHA256SUMS-station.txt
          ls -la

          upload() {
            local f=$1 attempt
            for attempt in 1 2 3; do
              if gh release upload main-latest --repo "$GITHUB_REPOSITORY" --clobber "$f"; then return 0; fi
              echo "::warning::upload of $f failed (attempt $attempt)"; sleep $((attempt * 30))
            done
            return 1
          }
          failed=()
          while read -r f; do upload "$f" || failed+=("$f"); done < <(ls -rS -- *)
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::failed to upload: ${failed[*]}"
            exit 1
          fi
