name: Tests

# The default run name of a pull_request run is the pull request's title. A
# mirror's title is "pr-N" now, but the name is pinned here as well so that it
# is the branch (tfc-hmi/pr-N) whatever the title says: this repository is
# public and tfc-hmi is not.
run-name: ${{ github.head_ref || github.event.action || github.event_name }}

# Everything a pull request of tfc-hmi has to pass, plus the builds it must
# prove it does not break.
#
# A pull request of tfc-hmi arrives as a mirror pull request here: the bridge
# workflow in tfc-hmi keeps a branch tfc-hmi/pr-N whose one file,
# tfc-hmi-source.json, names the commit to test, and adds a commit to it on
# every push over there. So this runs as an ordinary pull_request, with its
# checks on the mirror PR, and the verdict goes back to tfc-hmi as a commit
# status named "tfc-hmi-workflows / tests" on the source commit.
#
# The bridge never force-pushes that branch, so a workflow change for one
# tfc-hmi pull request can be committed to its mirror branch: the run reads
# the workflows and the source file from the same merge, so such a push is
# tested against the source commit the branch names and reports to it.
#
# A pull request of this repository itself, with no source file, tests
# tfc-hmi main against the changed workflows. Pushes to tfc-hmi main arrive
# as repository_dispatch "push-main"; a hand run takes any ref.

on:
  pull_request:
    branches: [main]
  repository_dispatch:
    types: [push-main]
  workflow_dispatch:
    inputs:
      ref:
        description: tfc-hmi commit, branch or tag to test
        type: string
        default: main
      # Keep it a string: a boolean input is the string "false" in an `if:`.
      seed:
        description: Seed for the 35-minute relay soak; 11 is the lane's own, a failed run's repro.log names the one to reproduce.
        type: string
        default: '11'

permissions:
  contents: read

# A new push to the same PR supersedes the run in flight. Pushes to main and
# hand runs are never cancelled: verification you never get is worth nothing.
concurrency:
  group: tests-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

jobs:
  # One place that turns the event into the inputs every other job reads.
  context:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.ctx.outputs.ref }}
      group: ${{ steps.ctx.outputs.group }}
      pr: ${{ steps.ctx.outputs.pr }}
      report: ${{ steps.ctx.outputs.report }}
      repo: ${{ steps.ctx.outputs.repo }}
    steps:
      - uses: actions/checkout@v4
      - id: ctx
        env:
          DISPATCH_SHA: ${{ github.event.client_payload.sha }}
          DISPATCH_REPO: ${{ github.event.client_payload.repository }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          ref=''; pr=''; report=false; repo=centroid-is/CentroidX
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if [ -f tfc-hmi-source.json ]; then
              # Base64 of the JSON; a mirror written before that holds it plain.
              src=$(base64 -d tfc-hmi-source.json 2>/dev/null | jq -ec . 2>/dev/null) || src=$(cat tfc-hmi-source.json)
              ref=$(jq -r .sha <<<"$src"); pr=$(jq -r .pr <<<"$src"); report=true
              repo=$(jq -r '.repository // empty' <<<"$src"); repo=${repo:-centroid-is/CentroidX}
              echo "mirror of tfc-hmi#$pr"
            else
              ref=main
              echo "a pull request of this repository: testing tfc-hmi main against it"
            fi
          elif [ -n "$DISPATCH_SHA" ]; then
            ref=$DISPATCH_SHA; report=true; repo=${DISPATCH_REPO:-$repo}
          else
            ref=$INPUT_REF
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "report=$report" >> "$GITHUB_OUTPUT"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "group=${pr:+pr-$pr}" >> "$GITHUB_OUTPUT"
          echo "testing tfc-hmi $ref ${pr:+(PR #$pr)}"
      - name: Report pending to tfc-hmi
        if: steps.ctx.outputs.report == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh api repos/${{ steps.ctx.outputs.repo }}/statuses/${{ steps.ctx.outputs.ref }} \
            -f state=pending -f context='tfc-hmi-workflows / tests' \
            -f description='running' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  flutter-test:
    name: flutter-test (${{ matrix.os }})
    needs: context
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-source
        with:
          ref: ${{ needs.context.outputs.ref }}
          token: ${{ secrets.GH_PAT }}
      - name: Preference-store construction gate
        if: runner.os == 'Linux'
        working-directory: src
        run: |
          bash scripts/check-preferences-construction.sh
          bash scripts/check-flutter-preferences-retired.sh
      - uses: ./.github/actions/setup-flutter
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y libglib2.0-dev
      - uses: ./.github/actions/pub-get
        with:
          working-directory: src
      - name: flutter test
        working-directory: src
        env:
          # test/tools/*_test.dart read the workflows from this repository.
          CENTROIDX_WORKFLOWS_DIR: ${{ github.workspace }}/.github/workflows
        run: flutter test test/ --file-reporter "json:test-report.json"
      # Goldens are compared on Linux only; none may be skipped there.
      - name: The goldens ran
        if: always()
        working-directory: src
        run: bash scripts/check-goldens-ran.sh
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures-${{ matrix.os }}
          path: src/**/failures/**
          if-no-files-found: ignore
          retention-days: 7

  centroid-hmi-test:
    name: centroid-hmi-test (${{ matrix.os }})
    needs: context
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-source
        with:
          ref: ${{ needs.context.outputs.ref }}
          token: ${{ secrets.GH_PAT }}
      - uses: ./.github/actions/setup-flutter
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y libglib2.0-dev
      - uses: ./.github/actions/pub-get
        with:
          working-directory: src/centroid-hmi
      - working-directory: src/centroid-hmi
        run: flutter test test/ --file-reporter "json:test-report.json"
      # Pointing at the wrong package produces a passing run of nothing.
      - name: At least 15 tests ran
        if: always()
        shell: bash
        working-directory: src/centroid-hmi
        run: |
          total=$(grep -o '"type":"testStart"' test-report.json | wc -l)
          loading=$(grep -o '"name":"loading ' test-report.json | wc -l)
          ran=$((total - loading))
          echo "$ran tests ran"
          [ "$ran" -ge 15 ]

  dart-packages:
    name: ${{ matrix.package }} (${{ matrix.os }})
    needs: context
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        package: [modbus_client, modbus_client_tcp, tfc_mcp_server, tfc_access]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-source
        with:
          ref: ${{ needs.context.outputs.ref }}
          token: ${{ secrets.GH_PAT }}
      - uses: dart-lang/setup-dart@v1
      - uses: ./.github/actions/pub-get
        with:
          command: dart pub get
          working-directory: src/packages/${{ matrix.package }}
      # tfc_access has a purity suite that fails if it gains a tfc_dart or
      # open62541 dependency, so it is analysed as well.
      - if: matrix.package == 'tfc_access'
        working-directory: src/packages/${{ matrix.package }}
        run: dart analyze
      - working-directory: src/packages/${{ matrix.package }}
        run: dart test

  jbtm-test:
    name: jbtm-test (${{ matrix.os }})
    needs: context
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-source
        with:
          ref: ${{ needs.context.outputs.ref }}
          token: ${{ secrets.GH_PAT }}
      - uses: dart-lang/setup-dart@v1
      - uses: ./.github/actions/pub-get
        with:
          command: dart pub get
          working-directory: src/packages/jbtm
      - working-directory: src/packages/jbtm
        run: dart test --file-reporter "json:test-report.json"
      - name: At least 220 tests ran
        if: always()
        shell: bash
        working-directory: src/packages/jbtm
        run: |
          ran=$(grep -o '"type":"testStart"' test-report.json | wc -l)
          echo "$ran tests ran"
          [ "$ran" -ge 220 ]

  # packages/tfc_plant_sim is on main since #463; the job still passes
  # trivially on an older ref without it.
  plant-sim-test:
    needs: context
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-source
        with:
          ref: ${{ needs.context.outputs.ref }}
          token: ${{ secrets.GH_PAT }}
      - id: present
        run: |
          if [ -d src/packages/tfc_plant_sim ]; then echo present=true >> "$GITHUB_OUTPUT"
          else echo present=false >> "$GITHUB_OUTPUT"; echo "::notice::packages/tfc_plant_sim is not on this ref; nothing to test"; fi
      - if: steps.present.outputs.present == 'true'
        uses: dart-lang/setup-dart@v1
      - if: steps.present.outputs.present == 'true'
        uses: ./.github/actions/pub-get
        with:
          command: dart pub get
          working-directory: src/packages/tfc_plant_sim
      - if: steps.present.outputs.present == 'true'
        working-directory: src/packages/tfc_plant_sim
        run: |
          dart analyze
          dart test

  centroidx-upgrader-test:
    name: centroidx-upgrader-test (${{ matrix.os }})
    needs: context
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-source
        with:
          ref: ${{ needs.context.outputs.ref }}
          token: ${{ secrets.GH_PAT }}
      - uses: ./.github/actions/setup-flutter
      - uses: ./.github/actions/pub-get
        with:
          working-directory: src/packages/centroidx_upgrader
      - working-directory: src/packages/centroidx_upgrader
        run: flutter test

  tfc-dart-test:
    name: tfc-dart-test (${{ matrix.os }})
    needs: context
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            timescaledb_external: ''
          - os: macos-latest
            timescaledb_external: '1'
          - os: windows-latest
            timescaledb_external: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-source
        with:
          ref: ${{ needs.context.outputs.ref }}
          token: ${{ secrets.GH_PAT }}
      - uses: dart-lang/setup-dart@v1

      # Ubuntu runs TimescaleDB in Docker from the tests themselves; the other
      # two have no Docker and get a native server on localhost instead.
      - name: TimescaleDB (macOS)
        if: runner.os == 'macOS'
        run: |
          brew tap timescale/tap || true
          # Homebrew refuses formulae from third-party taps until the tap is trusted.
          brew trust timescale/tap || true
          brew install timescale/tap/timescaledb
          PG_FORMULA=$(basename "$(ls -d /opt/homebrew/opt/postgresql@* | sort -V | tail -1)")
          echo "/opt/homebrew/opt/$PG_FORMULA/bin" >> "$GITHUB_PATH"
          export PATH="/opt/homebrew/opt/$PG_FORMULA/bin:$PATH"
          /opt/homebrew/bin/timescaledb_move.sh || true
          DATA="/opt/homebrew/var/$PG_FORMULA"
          if [ ! -f "$DATA/PG_VERSION" ]; then initdb -D "$DATA"; fi
          echo "shared_preload_libraries = 'timescaledb'" >> "$DATA/postgresql.conf"
          brew services start "$PG_FORMULA"
          for i in $(seq 1 30); do pg_isready && break; sleep 1; done
          createdb testdb
          psql -d testdb -c "CREATE ROLE testuser WITH SUPERUSER LOGIN PASSWORD 'testpass'"
          psql -d testdb -c "CREATE EXTENSION IF NOT EXISTS timescaledb CASCADE"

      - name: TimescaleDB (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PGBIN: C:\Program Files\PostgreSQL\17\bin
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri https://github.com/timescale/timescaledb/releases/download/2.25.2/timescaledb-postgresql-17-windows-amd64.zip -OutFile ts.zip
          tar -xf ts.zip
          Push-Location (Get-ChildItem -Directory -Filter 'timescaledb*' | Select-Object -First 1).FullName
          .\setup.exe -yes-tune -pgconfig "$env:PGBIN\pg_config.exe"
          Pop-Location
          $data = "$env:RUNNER_TEMP\pgdata"
          & "$env:PGBIN\initdb.exe" -U postgres -A trust --encoding=UTF8 -D $data
          & "$env:PGBIN\pg_ctl.exe" -D $data -o "-cshared_preload_libraries=timescaledb" -w start
          & "$env:PGBIN\pg_isready.exe" --timeout=30
          & "$env:PGBIN\psql.exe" -U postgres -c "CREATE ROLE testuser WITH SUPERUSER LOGIN PASSWORD 'testpass'"
          & "$env:PGBIN\createdb.exe" -U postgres testdb
          & "$env:PGBIN\psql.exe" -U postgres -d testdb -c "CREATE EXTENSION IF NOT EXISTS timescaledb CASCADE"

      - uses: ./.github/actions/pub-get
        with:
          command: dart pub get
          working-directory: src/packages/tfc_dart
      - working-directory: src/packages/tfc_dart
        env:
          TIMESCALEDB_EXTERNAL: ${{ matrix.timescaledb_external }}
        run: dart test

      # The relay's db-tagged legs, against the database this job already
      # has (ubuntu: the tests' own Compose stack; macOS/Windows: the native
      # server above). Each count floor catches a tag that selects nothing,
      # which `dart test` reports as green.
      - name: tfc_relay_local db lane
        working-directory: src/packages/tfc_relay_local
        env:
          TIMESCALEDB_EXTERNAL: ${{ matrix.timescaledb_external }}
        run: |
          dart pub get
          dart test --tags db --file-reporter "json:test-report.json"
      - name: At least 120 relay db tests ran
        if: always()
        shell: bash
        working-directory: src/packages/tfc_relay_local
        run: |
          [ -f test-report.json ] || { echo "::error::the db lane produced no report"; exit 1; }
          total=$( { grep -o '"type":"testStart"' test-report.json || true; } | wc -l)
          loading=$( { grep -o '"name":"loading ' test-report.json || true; } | wc -l)
          ran=$((total - loading))
          echo "$ran relay db tests ran (148 when the floor was set)"
          [ "$ran" -ge 120 ]
      - name: tfc_relay_local gate db leg
        shell: bash
        working-directory: src/packages/tfc_relay_local
        env:
          TIMESCALEDB_EXTERNAL: ${{ matrix.timescaledb_external }}
        run: |
          dart test test/gate --tags db --file-reporter "json:gate-db-report.json"
          total=$( { grep -o '"type":"testStart"' gate-db-report.json || true; } | wc -l)
          loading=$( { grep -o '"name":"loading ' gate-db-report.json || true; } | wc -l)
          ran=$((total - loading))
          echo "$ran gate db tests ran"
          [ "$ran" -ge 1 ]

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfc-dart-results-${{ matrix.os }}
          path: |
            src/packages/tfc_dart/coverage/
            src/packages/tfc_dart/test-results/
          if-no-files-found: ignore
          retention-days: 30

  # The relay packages, one after another in one job: they bind ports and
  # measure milliseconds, so two of them on one runner at once are a flake.
  # The `floor` helper reads a JSON report and fails if fewer than N tests
  # started: a tag or path that selects nothing is green in `dart test`.
  relay-packages-test:
    name: relay-packages-test (${{ matrix.os }})
    needs: context
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      FLOOR: |
        floor() {
          [ -f "$1" ] || { echo "::error::no $1 - the step produced no report"; exit 1; }
          local total loading ran
          total=$( { grep -o '"type":"testStart"' "$1" || true; } | wc -l)
          loading=$( { grep -o '"name":"loading ' "$1" || true; } | wc -l)
          ran=$((total - loading))
          echo "$1: $ran tests ran (floor $2)"
          [ "$ran" -ge "$2" ] || { echo "::error::$1: only $ran tests ran, expected at least $2"; exit 1; }
        }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-source
        with:
          ref: ${{ needs.context.outputs.ref }}
          token: ${{ secrets.GH_PAT }}
      - uses: dart-lang/setup-dart@v1

      - name: tfc_relay_protocol
        working-directory: src/packages/tfc_relay_protocol
        run: |
          dart pub get
          dart analyze
          dart test
      # dart2js only: it coerces bitwise operators to 32 bits, which the VM
      # and dart2wasm never show. Scoped to the files that are web-clean.
      - name: tfc_relay_protocol on dart2js
        if: runner.os == 'Linux'
        working-directory: src/packages/tfc_relay_protocol
        run: |
          eval "$FLOOR"
          dart test -p chrome test/ulid_web_test.dart test/write_outcome_log_web_test.dart --file-reporter "json:web-report.json"
          floor web-report.json 14

      - name: tfc_stateman_contract
        working-directory: src/packages/tfc_stateman_contract
        run: |
          dart pub get
          dart analyze
          dart test --exclude-tags oslevel
      # tc netem needs root and iproute2; only ubuntu has both. The tests
      # skip by name if passwordless sudo ever goes away.
      - name: tfc_stateman_contract OS-level faults
        if: runner.os == 'Linux'
        working-directory: src/packages/tfc_stateman_contract
        run: |
          command -v tc >/dev/null || { sudo apt-get update && sudo apt-get install -y iproute2; }
          dart test --tags oslevel
      - name: Fault-lane wall-clock budget
        if: runner.os == 'Linux'
        working-directory: src/packages/tfc_stateman_contract
        env:
          FAULT_LANE_BUDGET: '1'
        run: dart test test/faults/mode_integrity_test.dart

      - name: tfc_relay_server
        working-directory: src/packages/tfc_relay_server
        run: |
          dart pub get
          dart analyze
          dart test

      - name: tfc_relay_client
        working-directory: src/packages/tfc_relay_client
        run: |
          dart pub get
          dart analyze
          dart test
      - name: tfc_relay_client on dart2js
        if: runner.os == 'Linux'
        working-directory: src/packages/tfc_relay_client
        run: |
          eval "$FLOOR"
          dart test -p chrome test/web/ --file-reporter "json:web-report.json"
          floor web-report.json 5
      # Measures the gate lane; it does not select. The test clears the
      # variable in the child it spawns and the child excludes the `meta`
      # tag; renaming that tag makes this recurse without end.
      - name: Gate-lane wall-clock budget
        if: runner.os == 'Linux'
        working-directory: src/packages/tfc_relay_client
        env:
          GATE_LANE_BUDGET: '1'
        run: dart test test/gate/gate_manifest_test.dart

      # Builds the open62541 native asset. A failure with no test output is
      # usually the download flaking: re-run before reading the diff. db legs
      # run in tfc-dart-test, which has the database; soak runs next.
      - name: tfc_relay_local
        working-directory: src/packages/tfc_relay_local
        run: |
          dart pub get
          dart analyze
          dart test --exclude-tags "db || soak"
      # The soak's 90-second arm, so the machinery cannot rot between full
      # runs. Its timeout and @Timeout on soak_test.dart move together.
      - name: Chaos soak (90 s arm)
        working-directory: src/packages/tfc_relay_local
        timeout-minutes: 15
        run: |
          eval "$FLOOR"
          dart test test/soak --tags soak --file-reporter "json:soak-report.json"
          floor soak-report.json 180
      - name: Gate-B-lane wall-clock budget
        if: runner.os == 'Linux'
        working-directory: src/packages/tfc_relay_local
        env:
          GATE_B_LANE_BUDGET: '1'
        run: dart test test/gate/gate_b_manifest_test.dart

  # The soak's 35-minute arm and the gate arms at full length, on every push
  # to main and on demand; never on a pull request (the 90 s arm above is the
  # PR's). Coalesces to the newest push. Ubuntu only: the socket-count
  # invariant cannot be judged on Windows. Not in `report`, which reads a
  # skip as a failure.
  relay-soak:
    name: relay soak (35 min)
    needs: context
    if: github.event_name != 'pull_request'
    concurrency:
      group: tests-relay-soak
      cancel-in-progress: true
    runs-on: ubuntu-latest
    # The library @Timeout(45 min) must fire first, so the failure has a
    # journal behind it.
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      FLOOR: |
        floor() {
          [ -f "$1" ] || { echo "::error::no $1 - the step produced no report"; exit 1; }
          local total loading ran
          total=$( { grep -o '"type":"testStart"' "$1" || true; } | wc -l)
          loading=$( { grep -o '"name":"loading ' "$1" || true; } | wc -l)
          ran=$((total - loading))
          echo "$1: $ran tests ran (floor $2)"
          [ "$ran" -ge "$2" ] || { echo "::error::$1: only $ran tests ran, expected at least $2"; exit 1; }
        }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-source
        with:
          ref: ${{ needs.context.outputs.ref }}
          token: ${{ secrets.GH_PAT }}
      - uses: dart-lang/setup-dart@v1
      - name: Chaos soak (35 min arm)
        working-directory: src/packages/tfc_relay_local
        env:
          RELAY_SOAK: '1'
          RELAY_SOAK_SEED: ${{ inputs.seed || '11' }}
        run: |
          eval "$FLOOR"
          dart pub get
          dart test test/soak --tags soak --file-reporter "json:soak-report.json"
          floor soak-report.json 180
      - name: Gate arms at full duration
        if: always()
        working-directory: src/packages/tfc_relay_client
        env:
          RELAY_SOAK: '1'
        run: |
          eval "$FLOOR"
          dart pub get
          dart test test/gate --tags gate --file-reporter "json:gate-report.json"
          floor gate-report.json 76
      # A green run's journal is the baseline a red one is read against.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relay-soak-seed-${{ inputs.seed || '11' }}-${{ github.run_id }}
          path: src/packages/tfc_relay_local/build/soak/
          retention-days: 7
          if-no-files-found: error

  # Mimic widgets over the real relay client, gateway, open62541 servers and
  # an M2400 stub, in one process. Opt-in by env var and --concurrency=1:
  # the plant iterates on a blocking 10 ms FFI timer and starves alongside
  # other suites. No skip is tolerated.
  e2e-assets-test:
    needs: context
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-source
        with:
          ref: ${{ needs.context.outputs.ref }}
          token: ${{ secrets.GH_PAT }}
      - uses: ./.github/actions/setup-flutter
      - run: sudo apt-get install -y libglib2.0-dev
      - uses: ./.github/actions/pub-get
        with:
          working-directory: src
      - name: e2e_assets
        working-directory: src
        env:
          CENTROIDX_E2E_ASSETS: '1'
        run: flutter test test/e2e_assets/ --concurrency=1 --file-reporter "json:e2e-assets-report.json"
      - name: At least 6 cases ran, none skipped
        if: always()
        working-directory: src
        run: |
          python3 - <<'PY'
          import json, sys
          ran = skipped = 0
          for line in open('e2e-assets-report.json', encoding='utf-8'):
              if not line.startswith('{'):
                  continue
              ev = json.loads(line)
              if ev.get('type') == 'testStart':
                  t = ev.get('test', {})
                  if t.get('name', '').startswith('loading '):
                      continue
                  ran += 1
                  skipped += bool((t.get('metadata') or {}).get('skip'))
          print(f"e2e_assets: {ran} started, {skipped} skipped")
          if skipped or ran < 6:
              print("::error::expected 6 cases and no skips: CENTROIDX_E2E_ASSETS is not reaching the tests, or a case stopped running")
              sys.exit(1)
          PY

  # Eleven /advanced/* routes over the real relay, against a real backend on
  # a Postgres the tests bring up in Docker (ubuntu only). Run again under a
  # non-UTC clock, which found a text-compared timestamp once. Cases named
  # KNOWN RED assert a fix not yet made: they run only with the second
  # switch, and one that passes must be promoted.
  e2e-pages-test:
    needs: context
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-source
        with:
          ref: ${{ needs.context.outputs.ref }}
          token: ${{ secrets.GH_PAT }}
      - uses: ./.github/actions/setup-flutter
      - run: sudo apt-get install -y libglib2.0-dev
      - uses: ./.github/actions/pub-get
        with:
          working-directory: src
      - name: e2e_pages
        working-directory: src
        env:
          CENTROIDX_E2E_PAGES: '1'
        run: flutter test test/e2e_pages --concurrency=1 --file-reporter "json:e2e-pages-report.json"
      - name: At least 51 cases ran green, no unexplained skips
        if: always()
        working-directory: src
        run: |
          python3 - <<'PY'
          import json, sys
          ran = known_red = other = 0
          for line in open('e2e-pages-report.json', encoding='utf-8'):
              if not line.startswith('{'):
                  continue
              ev = json.loads(line)
              if ev.get('type') != 'testStart':
                  continue
              t = ev.get('test', {}); n = t.get('name', '')
              if n.startswith('loading ') or n.endswith('(setUpAll)') or n.endswith('(tearDownAll)'):
                  continue
              ran += 1
              if (t.get('metadata') or {}).get('skip'):
                  if 'KNOWN RED' in n: known_red += 1
                  else: other += 1
          green = ran - known_red - other
          print(f"e2e_pages: {ran} started, {green} green, {known_red} known-red, {other} other skips")
          if other or green < 51:
              print("::error::expected 51 green and no other skips: CENTROIDX_E2E_PAGES is not reaching the tests, or a case stopped running")
              sys.exit(1)
          PY
      - name: e2e_pages under a clock that is not UTC
        if: always()
        working-directory: src
        env:
          CENTROIDX_E2E_PAGES: '1'
          TZ: Europe/Copenhagen
        run: flutter test test/e2e_pages --concurrency=1
      - name: Known-red cases are still red
        if: always()
        working-directory: src
        env:
          CENTROIDX_E2E_PAGES: '1'
          CENTROIDX_E2E_PAGES_KNOWN_RED: '1'
        run: |
          flutter test test/e2e_pages --concurrency=1 --file-reporter "json:e2e-pages-knownred.json" || true
          python3 - <<'PY'
          import json, sys
          names, results = {}, {}
          for line in open('e2e-pages-knownred.json', encoding='utf-8'):
              if not line.startswith('{'):
                  continue
              ev = json.loads(line)
              if ev.get('type') == 'testStart':
                  names[ev['test']['id']] = ev['test'].get('name', '')
              elif ev.get('type') == 'testDone' and not ev.get('hidden'):
                  results[ev.get('testID')] = ev.get('result')
          now_green = [n for i, n in names.items() if 'KNOWN RED' in n and results.get(i) == 'success']
          for n in now_green:
              print(f"::error::this KNOWN RED case now passes; promote it to a normal case: {n}")
          sys.exit(1 if now_green else 0)
          PY

  windows-runner-cpp-test:
    name: windows-runner-cpp-test (${{ matrix.os }})
    needs: context
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-source
        with:
          ref: ${{ needs.context.outputs.ref }}
          token: ${{ secrets.GH_PAT }}
      - working-directory: src/centroid-hmi/windows/runner/test
        run: |
          cmake -S . -B build
          cmake --build build --config Debug
          ctest --test-dir build --build-config Debug --output-on-failure

  elinux-video-plugin-cpp-test:
    name: elinux-video-plugin-cpp-test (${{ matrix.os }})
    needs: context
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-source
        with:
          ref: ${{ needs.context.outputs.ref }}
          token: ${{ secrets.GH_PAT }}
      - working-directory: src/packages/media_kit_video_elinux
        run: |
          cmake -S elinux/test -B build/test -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/test --config Debug
          ctest --test-dir build/test --build-config Debug --verbose --output-on-failure 2>&1 | tee test-output.txt
          ran=$(grep -c 'RUN  ' test-output.txt || true)
          echo "$ran tests ran"
          [ "$ran" -ge 16 ]

  webview-cef-cpp-test:
    name: webview-cef-cpp-test (${{ matrix.os }})
    needs: context
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-source
        with:
          ref: ${{ needs.context.outputs.ref }}
          token: ${{ secrets.GH_PAT }}
      # The POSIX half does not compile on Windows, hence the lower floor.
      - shell: bash
        working-directory: src/packages/webview_cef
        run: |
          cmake -S common/test -B build/test -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/test --config Debug
          ctest --test-dir build/test --build-config Debug --verbose --output-on-failure 2>&1 | tee test-output.txt
          ran=$(grep -c 'RUN  ' test-output.txt || true)
          floor=40; [ "${{ runner.os }}" = Windows ] && floor=28
          echo "$ran tests ran (floor $floor)"
          [ "$ran" -ge "$floor" ]

  tools-python-test:
    name: tools-python-test (${{ matrix.os }})
    needs: context
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-source
        with:
          ref: ${{ needs.context.outputs.ref }}
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - shell: bash
        working-directory: src
        run: |
          set -o pipefail
          python3 -m unittest discover -s tools -p 'test_*.py' -v 2>&1 | tee test-output.txt
          ran=$(grep -c ' \.\.\. ok$' test-output.txt || true)
          echo "$ran tests passed"
          [ "$ran" -ge 105 ]

  # The builds a PR must not break. Images are pushed as :pr-N when there is
  # a PR number, and only built otherwise.
  linux-build:
    needs: context
    uses: ./.github/workflows/linux.yml
    secrets: inherit
    with:
      ref: ${{ needs.context.outputs.ref }}
      group: ${{ needs.context.outputs.group }}
  macos-build:
    needs: context
    uses: ./.github/workflows/macos.yml
    secrets: inherit
    with:
      ref: ${{ needs.context.outputs.ref }}
      group: ${{ needs.context.outputs.group }}
  windows-build:
    needs: context
    uses: ./.github/workflows/windows.yml
    secrets: inherit
    with:
      ref: ${{ needs.context.outputs.ref }}
      group: ${{ needs.context.outputs.group }}
      stamp_unstable_version: true
  manager-build:
    needs: context
    uses: ./.github/workflows/manager.yml
    secrets: inherit
    with:
      ref: ${{ needs.context.outputs.ref }}
      group: ${{ needs.context.outputs.group }}
  elinux-images:
    needs: context
    uses: ./.github/workflows/elinux.yml
    secrets: inherit
    with:
      ref: ${{ needs.context.outputs.ref }}
      publish: pr
      pr_number: ${{ needs.context.outputs.pr }}
      group: ${{ needs.context.outputs.group }}
  station-checks:
    needs: context
    uses: ./.github/workflows/station-image.yml
    # station-image's build job declares contents: write for the hand-run
    # release case; a caller must grant at least that or the call is invalid.
    permissions:
      contents: write
    secrets: inherit
    with:
      ref: ${{ needs.context.outputs.ref }}
      validate_only: true
      group: ${{ needs.context.outputs.group }}

  # One verdict back to the PR in tfc-hmi.
  report:
    if: always() && needs.context.outputs.report == 'true'
    needs:
      - context
      - flutter-test
      - centroid-hmi-test
      - dart-packages
      - jbtm-test
      - plant-sim-test
      - centroidx-upgrader-test
      - tfc-dart-test
      - relay-packages-test
      - e2e-assets-test
      - e2e-pages-test
      - windows-runner-cpp-test
      - elinux-video-plugin-cpp-test
      - webview-cef-cpp-test
      - tools-python-test
      - linux-build
      - macos-build
      - windows-build
      - manager-build
      - elinux-images
      - station-checks
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failed=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "success" and .key != "context") | .key' | tr '\n' ' ')
          if [ -z "$failed" ]; then state=success; desc='all green'; else state=failure; desc="failed: $failed"; fi
          echo "$state: $desc"
          gh api repos/${{ needs.context.outputs.repo }}/statuses/${{ needs.context.outputs.ref }} \
            -f state="$state" -f context='tfc-hmi-workflows / tests' \
            -f description="${desc:0:130}" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          [ "$state" = success ]
